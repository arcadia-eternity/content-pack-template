name: Content pack
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@arcadia-eternity'
      - name: Install the published SDK and author tool
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ARCADIA_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund || {
            cat /home/runner/.npm/_logs/*-debug-0.log
            exit 1
          }
      - name: Typecheck and exercise the actual npm package
        run: npm test
      - name: Create the content package
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: content-pack
          path: '*.tgz'
          if-no-files-found: error
